<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дарьер — Характеристики</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #0b0b0b; color: #ededed; overflow: hidden; height: 100vh; }
        header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px 60px; background-color: #0d0d0d; border-bottom: 1px solid #161616; }
        .logo-container { display: flex; align-items: center; gap: 10px; justify-self: start; }
        .logo-icon { width: 24px; height: 24px; filter: invert(1); } 
        .logo { font-weight: bold; font-size: 20px; color: #fff; letter-spacing: 2px; }
        .overlay-bg { position: fixed; top: 65px; left: 0; width: 100%; height: calc(100vh - 65px); background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .window-box { background: #11141a; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; width: 92%; max-width: 500px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .click-outside-close { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 11; }
        .win-content { position: relative; z-index: 20; }
        .win-title { font-size: 20px; font-weight: 700; color: #fff; border-bottom: 1px solid #1f2430; padding-bottom: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .cryo-dot { width: 16px; height: 16px; background-image: url('./elements/cryo_element.png'); background-size: contain; background-repeat: no-repeat; display: inline-block; }
        .stats-table { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 14px 10px; }
        .th { color: #556573; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .td { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: #e2f2ff; }
        .stat-img { width: 14px; height: 14px; filter: invert(1); }
        .bottom-nav-bar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 30; width: 92%; max-width: 500px; display: flex; gap: 10px; }
        .nav-btn { flex: 1; display: flex; background: rgba(255,255,255,0.05); color: #888; font-weight: bold; padding: 14px 10px; border-radius: 12px; justify-content: center; align-items: center; font-size: 11px; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.08); text-decoration: none; }
        .nav-btn.active { background: #5ac4ff; color: #000; border-color: #5ac4ff; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container"><img src="./logo_svinoris.png" class="logo-icon" alt="🐷"><div class="logo">SVINORIS</div></div>
    </header>
    <div class="overlay-bg">
        <a href="index.html" class="click-outside-close"></a>
        <div class="window-box win-content">
            <div class="win-title"><span class="cryo-dot"></span>Дарьер — Возвышение</div>
            <div class="stats-table">
                <div class="th">Стат</div><div class="th">Lvl 1</div><div class="th">Lvl 90</div>
                <div class="td"><img src="./stats/hp.png" class="stat-img"> ХП</div><div class="td">1,024</div><div class="td" style="color:#5ac4ff;">11,347</div>
                <div class="td"><img src="./stats/attack.png" class="stat-img"> Атака</div><div class="td">26</div><div class="td" style="color:#5ac4ff;">307</div>
                <div class="td"><img src="./stats/def.png" class="stat-img"> Защита</div><div class="td">52</div><div class="td" style="color:#5ac4ff;">581</div>
                <div class="td"><span style="width:14px;height:14px;background-image:url('./elements/cryo_element.png');background-size:contain;display:inline-block;"></span> Крио</div><div class="td">0.00%</div><div class="td" style="color:#5ac4ff;">0.00%</div>
                <div class="td"><img src="./stats/crit_rate.png" class="stat-img"> Крит %</div><div class="td">5.00%</div><div class="td" style="color:#5ac4ff;">5.00%</div>
                <div class="td"><img src="./stats/crit_dmg.png" class="stat-img"> Крит Ур</div><div class="td">50.0%</div><div class="td" style="color:#5ac4ff;">88.0%</div>
            </div>
        </div>
    </div>
    <div class="bottom-nav-bar">
        <a href="darier.html" class="nav-btn active">Статы</a>
        <a href="darier_talents.html" class="nav-btn">Таланты</a>
        <a href="darier_const.html" class="nav-btn">Созвездия</a>
    </div>
</body>
</html>
